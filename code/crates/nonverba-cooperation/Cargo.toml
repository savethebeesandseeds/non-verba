[package]
name = "nonverba-cooperation"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Deterministic task cooperation calculations and verification plans"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
