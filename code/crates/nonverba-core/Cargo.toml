[package]
name = "nonverba-core"
version = "0.7.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
c2pa = { version = "=0.91.0", default-features = false, features = ["rust_native_crypto"] }
c2pa_raw_crypto = { version = "=0.1.2", default-features = false, features = ["rust_native_crypto"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
coset = "=0.4.2"
getrandom = { version = "=0.2.16", features = ["js"] }
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
kamadak-exif = "=0.6.1"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
pem = "=3.0.6"
rcgen = { version = "=0.14.10", default-features = false, features = ["pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
x509-parser = "=0.18.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "=0.4.72"

[dev-dependencies]
futures = { version = "=0.3.31", features = ["executor"] }
