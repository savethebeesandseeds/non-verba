[package]
name = "nonverba-requests"
version = "0.2.1"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Non-verba three-party assignment protocol and portable verifier"

# Deliberately independent of the sensor workspace while the boundary is designed.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_jcs = "=0.2.0"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"
base64 = "=0.22.1"
getrandom = { version = "=0.2.16", features = ["js"] }
zeroize = "=1.8.2"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
pbkdf2 = "=0.12.2"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
