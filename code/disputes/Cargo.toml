[package]
name = "nonverba-disputes"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Non-verba analysis-only dispute priors and local inference adapter"

[workspace]

[dependencies]
nonverba-requests = { path = "../requests" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
zeroize = "=1.8.2"
sha2 = "=0.10.9"

[[bin]]
name = "nonverba-disputes"
path = "src/main.rs"
